services:

  backend:
    build: ./backend

    container_name: code-review-backend

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/code_review
      REDIS_URL: redis://redis:6379

    depends_on:
      - postgres
      - redis


  frontend:
    build: ./frontend

    container_name: code-review-frontend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend


  postgres:
    image: postgres:16

    container_name: code-review-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: code_review

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7

    container_name: code-review-redis

    ports:
      - "6379:6379"


volumes:

  postgres_data: